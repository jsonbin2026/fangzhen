# CncSim · Android APK 构建工作流
# 用法：推送到 main 后，在仓库 Actions 页面手动选择 "Build Android APK" 运行
#
# 必需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   UNITY_LICENSE   Unity 许可证（.ulf 内容）。获取方式见 game-ci 文档
#   UNITY_EMAIL     Unity 账号邮箱
#   UNITY_PASSWORD  Unity 账号密码
#   UNITY_TOTP_KEY  （可选）开启 2FA 时填 Authenticator 密钥
#
# 说明：本工作流使用 game-ci/unity-builder Action 自动完成 Unity 安装、
#       授权与构建，无需手动下载安装脚本。

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity 版本'
        required: true
        default: '2022.3.62f1'
        type: string
      scripting_backend:
        description: '脚本后端（Mono 最快、最省内存，先跑通这个）'
        required: true
        default: 'Mono'
        type: choice
        options: [Mono, IL2CPP]
      target_abi:
        description: '目标 ABI（ARMv7 兼容性最好）'
        required: true
        default: 'ARMv7'
        type: choice
        options: [ARMv7, ARM64, 'ARMv7, ARM64']
      androidTargetSdkVersion:
        description: 'Android Target SDK'
        required: true
        default: 'Auto'
        type: choice
        options: [Auto, 33, 34]
      androidExportType:
        description: '导出类型'
        required: true
        default: 'androidPackage'
        type: choice
        options: [androidPackage, androidAppBundle]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 检出仓库（含 LFS）
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: 构建 Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        with:
          unityVersion: ${{ inputs.unityVersion }}
          targetPlatform: Android
          androidTargetArchitectures: ${{ inputs.target_abi }}
          androidTargetSdkVersion: ${{ inputs.androidTargetSdkVersion }}
          androidExportType: ${{ inputs.androidExportType }}
          customParameters: -buildTarget Android -scriptingBackend ${{ inputs.scripting_backend }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CncSim-Android-Build
          path: build
          retention-days: 7
